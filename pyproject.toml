[project]
name = "CrossMap"
version = "0.7.4"

description = "Convert genomic coordinates, annotations, and alignments between genome assemblies."
readme = "README.rst"
license = {file = "LICENSE.txt"}

requires-python = ">=3.8"

authors = [
    {name = "Liguo Wang", email = "wangliguo78@gmail.com"},
]

dependencies = [
    "pysam>=0.22",
    "bx-python>=0.11",
    "pyBigWig>=0.3.22",
]

keywords = [
    "genome",
    "genomics",
    "liftover",
    "bioinformatics",
    "assembly",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx_rtd_theme>=2.0",
]

[project.scripts]
CrossMap = "cmmodule:crossmap"

[project.urls]
Homepage = "https://github.com/liguowang/CrossMap"
Documentation = "https://crossmap.readthedocs.io/"
Repository = "https://github.com/liguowang/CrossMap"
Issues = "https://github.com/liguowang/CrossMap/issues"
